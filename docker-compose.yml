services:
  salt-master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: salt-master
    hostname: salt-master
    volumes:
      - ./salt-states:/srv/salt
    networks:
      - salt-net

  salt-minion:
    build:
      context: .
      dockerfile: Dockerfile.minion
    container_name: salt-minion
    hostname: salt-minion
    depends_on:
      - salt-master
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ygutierrez/src/salt-extensions/saltext-dockermod/src/saltext:/opt/saltstack/salt/extras-3.14/saltext
    networks:
      - salt-net

networks:
  salt-net:
    driver: bridge
